name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package and publish
        # Tag pushes and manual runs both publish the Setup exe and portable zip
        # to a public GitHub Release for the version in package.json. The release
        # goes to the repository running this workflow, including forks.
        run: >-
          npx electron-builder --win
          --publish always
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Skonester-CK3-Mod-Editor-Setup
          path: |
            dist/*-Setup-*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
