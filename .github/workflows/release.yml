name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package and publish
        # A v* tag publishes the Setup exe and portable zip onto that tag's GitHub
        # Release; a manual run only packages them (grab them from the artifact
        # below). The release goes to whichever repo runs the workflow, not the
        # one hard-coded in electron-builder.yml, so a fork publishes to itself.
        run: >-
          npx electron-builder --win
          --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
          --config.publish.owner=${{ github.repository_owner }}
          --config.publish.repo=${{ github.event.repository.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Skonester-CK3-Mod-Editor-Setup
          path: |
            dist/*-Setup-*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
