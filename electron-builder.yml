appId: com.kevinsherman.ck3-tools
productName: Skonester CK3 Mod Editor
directories:
  output: dist
files:
  - out/**
  - package.json
  # GPL-3.0 + Commons Clause: the license and its notices travel with every build
  - LICENSE
  - NOTICE.md
  # window icon, loaded at runtime from main via ?asset
  - resources/icon.png
win:
  icon: resources/icon.ico
  # Hyphens, not the product name's spaces, which GitHub turns into dots on upload
  artifactName: Skonester-CK3-Mod-Editor-${version}-win.${ext}
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Skonester-CK3-Mod-Editor-Setup-${version}.${ext}
  # No electron-updater in the app, so the differential-update blockmap is dead weight
  differentialPackage: false
publish:
  provider: github
  owner: haegemonia-ck3
  repo: ck3-tools
  # Upload straight onto the tag's public release; the default (draft) leaves the
  # installer on a hidden draft while the visible release shows only GitHub's
  # automatic source archives.
  releaseType: release
  # latest.yml only feeds electron-updater, which the app doesn't use
  publishAutoUpdate: false
