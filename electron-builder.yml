appId: com.kevinsherman.ck3-tools
productName: CK3 Tools
directories:
  output: dist
files:
  - out/**
  - package.json
  # window icon, loaded at runtime from main via ?asset
  - resources/icon.png
win:
  icon: resources/icon.ico
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: CK3-Tools-Setup-${version}.${ext}
  # No electron-updater in the app, so the differential-update blockmap is dead weight
  differentialPackage: false
publish:
  provider: github
  owner: haegemonia-ck3
  repo: ck3-tools
  # Upload straight onto the tag's public release; the default (draft) leaves the
  # installer on a hidden draft while the visible release shows only GitHub's
  # automatic source archives.
  releaseType: release
  # latest.yml only feeds electron-updater, which the app doesn't use
  publishAutoUpdate: false
